name: Build Windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build helper sidecar
        shell: bash
        run: |
          cd src-tauri
          cargo build --release -p flash-helper
          TRIPLE=$(rustc -vV | sed -n 's/.*host: \(.*\)/\1/p')
          mkdir -p binaries
          cp target/release/flash-helper.exe "binaries/flash-helper-${TRIPLE}.exe"
          echo "Sidecar triple: ${TRIPLE}"

      - name: Build and bundle (NSIS/MSI)
        shell: bash
        run: pnpm tauri build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SDCardImager-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
