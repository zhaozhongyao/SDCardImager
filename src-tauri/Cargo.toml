[workspace]
members = [".", "helper"]

[package]
name = "sdcard-image-flasher"
version = "0.1.0"
description = "Cross-platform SD card image flasher"
edition = "2021"

[lib]
name = "sdcard_image_flasher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
