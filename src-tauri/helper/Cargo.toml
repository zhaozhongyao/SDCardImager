[package]
name = "flash-helper"
version = "0.1.0"
edition = "2021"

[dependencies]
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_System_Ioctl",
  "Win32_System_IO",
  "Win32_System_Threading",
] }
